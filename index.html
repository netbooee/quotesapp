<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Wisdom — A Quote a Day</title>
    <meta
      name="description"
      content="A deep, meaningful two-sentence quote for every day. Browse the past for daily inspiration, motivation, and productivity wisdom."
    />
    <meta name="theme-color" content="#2c2113" />

    <!-- iOS Home Screen icon (Apple applies its own rounded-corner mask) -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <!-- Standalone "Add to Home Screen" behavior + title -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Wisdom" />

    <!-- Favicons + web app manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Cutive+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <h1 class="masthead__title">Daily Wisdom</h1>
        <p class="masthead__subtitle">A meaningful quote for every day</p>
      </header>

      <nav class="day-selector" aria-label="Browse quotes by day">
        <button
          class="day-nav day-nav--prev"
          id="prevDay"
          type="button"
          aria-label="Previous day"
        >
          &#8592;
        </button>

        <div class="day-strip" id="dayStrip" role="tablist"></div>

        <button
          class="day-nav day-nav--next"
          id="nextDay"
          type="button"
          aria-label="Next day"
        >
          &#8594;
        </button>
      </nav>

      <section class="parchment-wrap">
        <article class="parchment" id="parchment" aria-live="polite">
          <p class="parchment__date" id="quoteDate"></p>
          <blockquote class="parchment__quote" id="quoteText"></blockquote>
          <p class="parchment__author" id="quoteAuthor"></p>
        </article>
      </section>

      <div class="actions">
        <button class="action-btn" id="randomBtn" type="button">
          🎲 Random Quote
        </button>
        <button class="action-btn action-btn--ai" id="aiBtn" type="button">
          ✨ Generate with AI
        </button>
      </div>

      <footer class="page__footer">
        <button class="today-btn" id="todayBtn" type="button">
          Return to Today
        </button>
      </footer>
    </main>

    <script src="quotes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
